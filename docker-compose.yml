services:
  anomaly-app:
    build: .
    ports: ["5000:5000"]
    environment: {PORT: "5000"}
    restart: unless-stopped
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
