apiVersion: apps/v1
kind: Deployment
metadata: {name: anomaly-detection}
spec:
  replicas: 2
  selector: {matchLabels: {app: anomaly-detection}}
  template:
    metadata: {labels: {app: anomaly-detection}}
    spec:
      containers:
        - name: web
          image: YOUR_DOCKERHUB_USERNAME/system-log-anomaly-detection:v1.0.0
          ports: [{containerPort: 5000}]
          readinessProbe: {httpGet: {path: /health, port: 5000}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 5000}, initialDelaySeconds: 15, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: anomaly-detection-service}
spec:
  type: NodePort
  selector: {app: anomaly-detection}
  ports: [{port: 5000, targetPort: 5000, nodePort: 30080}]
